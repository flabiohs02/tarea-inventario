spring.application.name=inventory-reservations
server.port=8080

# ---------------------------------------------------------------------------
# Business rules
# ---------------------------------------------------------------------------
# Purchasing is warned when a product has this many available units or fewer.
inventory.low-stock-threshold=5

# One block per ProductCategory. The app does not start if a category is missing.
#   payment-window: time to pay (Spring Duration: 30s, 15m, 24h, P1D...)
#   max-units-per-order: omit it for "no limit"
inventory.categories.STANDARD.payment-window=15m

# Paid by bank transfer, which takes longer.
inventory.categories.PRE_ORDER.payment-window=24h

inventory.categories.FLASH_SALE.payment-window=5m
inventory.categories.FLASH_SALE.max-units-per-order=2

# ---------------------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
inventory.api.title=Inventory Reservations API
inventory.api.version=1.0.0
inventory.api.description=Reserva unidades mientras el cliente paga, las libera si no paga a tiempo y las confirma cuando el pago se aprueba.

# Return ProblemDetail (RFC 9457) bodies for framework errors too.
spring.mvc.problemdetails.enabled=true
